name: CD
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
      title: ${{ github.ref_name }}
    # 未配置该 secret 时为空串：构建出的客户端不内置默认 Key。
    secrets:
      MICS_CURSEFORGE_API_KEY: ${{ secrets.MICS_CURSEFORGE_API_KEY }}
