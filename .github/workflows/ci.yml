name: CI
on:
  push:
    # 只跑分支：tag 推送交给 cd.yml，同一个提交不用在打 tag 时再跑一遍 CI。
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: CI
        run: pnpm workflow:ci

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: mics-out
          path: |
            apps/desktop/out
            plugins/*/dist
          if-no-files-found: error
          retention-days: 7

  # 推送到 main 且 CI 通过后发快照。打 tag 不一定和提交同时推送，
  # 所以 release.yml 会在发布前再查一次该提交有没有 tag，有就跳过。
  snapshot:
    name: Snapshot
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: snapshot
      title: Snapshot
      rolling: true
