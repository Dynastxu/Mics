name: CI
on:
  push:
    # 只跑分支：tag 推送交给 cd.yml，同一个提交不用在打 tag 时再跑一遍 CI。
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: CI
        run: pnpm workflow:ci

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: mics-out
          path: |
            apps/desktop/out
            plugins/*/dist
          if-no-files-found: error
          retention-days: 7

  # 先在几秒内判断这次提交是不是已经打过 tag（tag 和分支一起推时很常见）。
  # 打过就没有快照可发，直接跳过，省掉三平台的一整套构建。
  snapshot_check:
    name: Snapshot precheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tagged: ${{ steps.check.outputs.tagged }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Check for a version tag
        id: check
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          others="$(git tag --points-at HEAD | grep -vx snapshot || true)"
          if [ -n "${others}" ]; then
            echo "提交 $(git rev-parse --short HEAD) 已有 tag：$(echo "${others}" | tr '\n' ' ')，跳过快照"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

  # CI 通过、且这次提交还没打 tag 才发快照。tag 也可能在构建期间才推上来，
  # 所以 release.yml 发布前还会再查一次。
  snapshot:
    name: Snapshot
    needs: [ci, snapshot_check]
    if: needs.snapshot_check.outputs.tagged == 'false'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: snapshot
      title: Snapshot
      rolling: true
