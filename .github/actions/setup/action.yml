name: Setup
description: 安装 pnpm 与 Node.js（带 pnpm store 缓存），并按 lockfile 安装依赖。调用前必须已 checkout。

runs:
  using: composite
  steps:
    # 版本来自 package.json 的 "packageManager" 字段。
    # 不要加 "version" 输入：同时指定会报 "Multiple versions of pnpm specified"。
    # 该 action 必须 >= 6.1.0：更早的版本先用 pnpm 11 引导再 self-update，而 pnpm 12
    # 是原生可执行文件，在 Windows 上会生成失效的 shim（pnpm/action-setup#288）。
    - name: Set up pnpm
      uses: pnpm/action-setup@v6

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
